              '<img class="thumb" id="photo-' + rowId + '" src="' + p.photo + '" title="' + esc(p.cafe) + '" style="width:100%;height:90px;object-fit:cover;">' +
              '<div style="font-size:10px;font-weight:700;margin-top:4px;">' + esc(p.cafe) + '</div>' +
              '<div style="font-size:9px;color:var(--grey-500);">' + esc(p.questionLabel) + '</div>' +
            '</div>';
          }).join('') +
          '</div>' +
        '</div>';
      }

      var s = d.summary || {};
      var summaryFooterHtml = '<div class="card" style="margin-bottom:20px;">' +
        '<div class="editor-section-title" style="margin-top:0;">Launch Summary</div>' +
        '<div class="tracker-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));">' +
          statBlock(s.submissionRate === null ? '—' : s.submissionRate + '%', 'Launch Success Rate') +
          statBlock(s.totalFlaggedInputs, 'Flagged Inputs') +
          statBlock(s.actionedFlaggedInputs, 'Actioned') +
          statBlock(s.pendingFlaggedInputs, 'Pending Action') +
          statBlock(s.launchAccuracyRate === null ? '—' : s.launchAccuracyRate + '%', 'Launch Accuracy Rate') +
          statBlock(s.launchActionRate === null ? '—' : s.launchActionRate + '%', 'Launch Action Rate') +
        '</div>' +
        '<div class="hint" style="margin-top:10px;">' +
          (d.sections
            ? 'Launch Success Rate = % of assigned cafés that have completed every section. '
            : 'Launch Success Rate = % of submissions received vs allocated cafés. ') +
          'Launch Accuracy Rate = % of flagged inputs vs submissions. ' +
          'Launch Action Rate = % of flagged inputs actioned.' +
        '</div>' +
      '</div>';

      // ---- Sectioned trackers (Pre-/Post-Launch): a progress card per section, then the same
      // Yes/No breakdown + comment + photo rendering used for flat trackers, run once per section.
      var sectionsHtml = '';
      var sectionPhotos = [];
      if (d.sections && d.sections.length) {
        sectionsHtml = '<div class="card" style="margin-bottom:20px;"><div class="editor-section-title" style="margin-top:0;">Section Progress</div>' +
          d.sections.map(function (sec) {
            return '<div class="answer-row"><span class="a-label">' + esc(sec.label) + (sec.repeatable ? ' <span class="hint" style="display:inline;">(repeatable, min ' + sec.minOccurrences + ')</span>' : '') + '</span>' +
              '<span style="font-size:11px;color:var(--grey-500);">' + sec.cafesStarted + ' café(s) started · ' + sec.totalOccurrenceSubmissions + ' submission(s) total</span></div>';
          }).join('') +
        '</div>';

        sectionsHtml += d.sections.map(function (sec) {
          (sec.itemBreakdown || []).forEach(function (item) {
            (item.noEntries || []).forEach(function (e) { if (e.photo) sectionPhotos.push({ cafe: e.cafe, questionLabel: sec.label + ' — ' + item.label, photo: e.photo }); });
          });
          (sec.textResponses || []).forEach(function (item) {
            (item.responses || []).forEach(function (r) { if (r.photo) sectionPhotos.push({ cafe: r.cafe, questionLabel: sec.label + ' — ' + item.label, photo: r.photo }); });
          });
          return questionBlock(sec.label + ' — Breakdown', sec.itemBreakdown || [], false) +
            textResponsesBlock(sec.label + ' — Comments', sec.textResponses || []);
        }).join('');
      }

      document.getElementById('insightBody').innerHTML = summaryHtml + summaryFooterHtml + missingHtml + exemptHtml + sectionsHtml +
        questionBlock('Checklist Question Breakdown', d.questionBreakdown, false) +
        questionBlock('Conditional Section Breakdown', d.conditionalBreakdown, true) +
        textResponsesBlock('Checklist Comment Responses', d.textResponses) +
        textResponsesBlock('Conditional Comment Responses', d.textResponsesConditional) +
        photoGalleryBlock((d.photoSubmissions || []).concat(sectionPhotos));

      document.getElementById('insightBody').querySelectorAll('[id^="photo-gal-"]').forEach(function (img) {
        img.onclick = function () { openLightbox(img.src); };
      });
      document.getElementById('insightBody').querySelectorAll('[id^="photo-txt-"]').forEach(function (img) {
        img.onclick = function () { openLightbox(img.src); };
      });

      function setRowLocked(rowId, locked) {
        var row = document.querySelector('.neg-row[data-row-id="' + rowId + '"]');
        var textarea = document.querySelector('[data-comment-id="' + rowId + '"]');
        var checkbox = document.querySelector('[data-actioned-id="' + rowId + '"]');
        var saveBtn = document.querySelector('[data-save-id="' + rowId + '"]');
        var editBtn = document.querySelector('[data-edit-id="' + rowId + '"]');
        row.setAttribute('data-locked', locked ? '1' : '0');
        textarea.disabled = locked;
        textarea.style.background = locked ? 'var(--grey-100)' : '';
        textarea.style.color = locked ? 'var(--grey-700)' : '';
        checkbox.disabled = locked;
        saveBtn.style.display = locked ? 'none' : 'inline-block';
        editBtn.style.display = locked ? 'inline-block' : 'none';
      }

      document.getElementById('insightBody').querySelectorAll('[id^="photo-neg-"]').forEach(function (img) {
        img.onclick = function () { openLightbox(img.src); };
      });

      document.getElementById('insightBody').querySelectorAll('[data-edit-id]').forEach(function (btn) {
        btn.onclick = function () { setRowLocked(btn.getAttribute('data-edit-id'), false); };
      });

      document.getElementById('insightBody').querySelectorAll('[data-save-id]').forEach(function (btn) {
        btn.onclick = function () {
          var rowId = btn.getAttribute('data-save-id');
          var subId = btn.getAttribute('data-sub');
          var itemId = btn.getAttribute('data-item');
          var isCond = btn.getAttribute('data-cond') === '1';
          var comment = document.querySelector('[data-comment-id="' + rowId + '"]').value;
          var actioned = document.querySelector('[data-actioned-id="' + rowId + '"]').checked;
          api('/submissions/' + subId + '/answer', { method: 'PATCH', body: { itemId: itemId, isConditional: isCond, comment: comment, actioned: actioned } })
            .then(function () {
              var savedEl = document.getElementById('saved-' + rowId);
              savedEl.textContent = 'Saved ✓';
              setTimeout(function () { savedEl.textContent = ''; }, 2000);
              if (actioned) setRowLocked(rowId, true);
            })
            .catch(function (e) { alert('Failed to save: ' + e.message); });
        };
      });
    }).catch(function (e) {
      document.getElementById('insightBody').innerHTML = '<div class="card empty-state">Failed to load insights: ' + esc(e.message) + '</div>';
    });
  }

  function statBlock(value, label) {
    return '<div><div class="t-stat-value">' + value + '</div><div class="t-stat-label">' + esc(label) + '</div></div>';
  }

  function exportInsightsPDF(d) {
    if (!window.jspdf) { alert('PDF library still loading — please try again in a moment.'); return; }
    var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
    var y = 44;
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var marginLeft = 44;
    var marginRight = 44;
    var maxWidth = pageWidth - marginLeft - marginRight;
    var BOTTOM_LIMIT = pageHeight - 55; // leaves room for the footer stamped in later

    var GOLD = [200, 174, 121];
    var GOLD_LIGHT = [250, 246, 238];
    var BLACK = [26, 26, 26];
    var GREY = [130, 130, 130];
    var GREY_LIGHT = [235, 235, 235];
    var GREEN = [74, 124, 74];
    var RED = [169, 68, 66];

    function newPageIfNeeded(neededHeight) {
      if (y + neededHeight > BOTTOM_LIMIT) {
        doc.addPage();
        y = 44;
      }
    }
    function goldRule(yy) {
      doc.setDrawColor(GOLD[0], GOLD[1], GOLD[2]);
      doc.setLineWidth(1.5);
      doc.line(marginLeft, yy, pageWidth - marginRight, yy);
    }
    function sectionTitle(text) {
      newPageIfNeeded(30);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
      doc.setTextColor(BLACK[0], BLACK[1], BLACK[2]);
      doc.text(text.toUpperCase(), marginLeft, y);
      y += 7;
      doc.setDrawColor(GREY_LIGHT[0], GREY_LIGHT[1], GREY_LIGHT[2]);
      doc.setLineWidth(0.75);
      doc.line(marginLeft, y, pageWidth - marginRight, y);
      y += 18;
    }
    function bodyLine(text, opts) {
      opts = opts || {};
      doc.setFont('helvetica', opts.italic ? 'italic' : (opts.bold ? 'bold' : 'normal'));
      doc.setFontSize(opts.size || 9.5);
      var color = opts.color || BLACK;
      doc.setTextColor(color[0], color[1], color[2]);
      var indent = opts.indent || 0;
      var lines = doc.splitTextToSize(text, maxWidth - indent);
      newPageIfNeeded(lines.length * 12.5 + 4);
      doc.text(lines, marginLeft + indent, y);
      y += lines.length * 12.5 + (opts.gap === undefined ? 4 : opts.gap);
    }
    // Draws a bordered "card" containing a row of stat blocks, sized to the content — mirrors
    // the on-screen summary cards rather than plain inline text.
    function statCard(stats) {
      var cardHeight = stats.length > 4 ? 66 : 58;
      newPageIfNeeded(cardHeight + 10);
      doc.setFillColor(255, 255, 255);
      doc.setDrawColor(GREY_LIGHT[0], GREY_LIGHT[1], GREY_LIGHT[2]);
      doc.setLineWidth(0.75);
      doc.roundedRect(marginLeft, y, maxWidth, cardHeight, 3, 3, 'S');
      var colW = maxWidth / stats.length;
      stats.forEach(function (stat, i) {
        var x = marginLeft + colW * i + 14;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
        doc.setTextColor(BLACK[0], BLACK[1], BLACK[2]);
        doc.text(String(stat.value), x, y + 28);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5);
        doc.setTextColor(GREY[0], GREY[1], GREY[2]);
        var labelLines = doc.splitTextToSize(stat.label.toUpperCase(), colW - 20);
        doc.text(labelLines, x, y + 40);
      });
      y += cardHeight + 18;
    }
    function statusTag(text, x, yy, color) {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
      var w = doc.getTextWidth(text) + 10;
      doc.setFillColor(color[0], color[1], color[2]);
      doc.roundedRect(x, yy - 8, w, 12, 2, 2, 'F');
      doc.setTextColor(255, 255, 255);
      doc.text(text, x + 5, yy);
      return w;
    }

    // ---- Header ----
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.setTextColor(GREY[0], GREY[1], GREY[2]);
    doc.text('BOOTLEGGER', marginLeft, y);
    y += 22;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(19);
    doc.setTextColor(BLACK[0], BLACK[1], BLACK[2]);
    doc.text('Launch Tracker Report', marginLeft, y);
    y += 12;
    goldRule(y);
    y += 22;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.setTextColor(BLACK[0], BLACK[1], BLACK[2]);
    var titleLines = doc.splitTextToSize(d.tracker.name, maxWidth);
    doc.text(titleLines, marginLeft, y);
    y += titleLines.length * 15;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.setTextColor(GREY[0], GREY[1], GREY[2]);
    doc.text('Generated ' + new Date().toLocaleString('en-ZA'), marginLeft, y);
    y += 26;

    // ---- Summary ----
    sectionTitle('Summary');
    statCard([
      { value: d.totalAssigned === null ? '—' : d.totalAssigned, label: 'Assigned Cafés' },
      { value: d.totalSubmitted, label: 'Submitted' },
      { value: d.totalExempted, label: 'Exempted' },
      { value: d.totalMissing === null ? '—' : d.totalMissing, label: 'Not Yet Submitted' },
    ]);

    // ---- Launch Summary ----
    sectionTitle('Launch Summary');
    var s = d.summary || {};
    statCard([
      { value: (s.submissionRate === null ? '—' : s.submissionRate + '%'), label: 'Launch Success Rate' },
      { value: s.totalFlaggedInputs, label: 'Flagged Inputs' },
      { value: s.actionedFlaggedInputs, label: 'Actioned' },
      { value: s.pendingFlaggedInputs, label: 'Pending Action' },
      { value: (s.launchAccuracyRate === null ? '—' : s.launchAccuracyRate + '%'), label: 'Launch Accuracy Rate' },
      { value: (s.launchActionRate === null ? '—' : s.launchActionRate + '%'), label: 'Launch Action Rate' },
    ]);
    bodyLine('Launch Success Rate = % of submissions received vs allocated cafés. Launch Accuracy Rate = % of flagged inputs vs submissions. Launch Action Rate = % of flagged inputs actioned.', { size: 8, color: GREY, gap: 14 });

    if (d.totalMissing !== null) {
      sectionTitle('Not Yet Submitted (' + d.missingCafes.length + ')');
      bodyLine(d.missingCafes.length ? d.missingCafes.join('  ·  ') : 'All assigned cafés have submitted.', { gap: 16 });
    }

    sectionTitle('Exempted Cafés (' + d.exemptCafes.length + ')');
    bodyLine(d.exemptCafes.length ? d.exemptCafes.map(function (e) { return e.cafe + ' (' + e.reason + ')'; }).join('  ·  ') : 'None.', { gap: 16 });

    function pdfQuestionSection(title, items) {
      if (!items.length) return;
      sectionTitle(title);
      items.forEach(function (q, qi) {
        newPageIfNeeded(18);
        bodyLine(q.label + '   (' + q.yesCount + ' Yes / ' + q.noCount + ' No)', { bold: true, size: 10, gap: 8 });

        q.noEntries.forEach(function (entry) {
          var tag = entry.actioned ? 'ACTIONED' : 'PENDING';
          var tagColor = entry.actioned ? GREEN : RED;
          var rowHeight = entry.comment ? 26 : 14;
          newPageIfNeeded(rowHeight);

          doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
          doc.setTextColor(BLACK[0], BLACK[1], BLACK[2]);
          doc.text(entry.cafe, marginLeft + 12, y);
          statusTag(tag, pageWidth - marginRight - (tag.length * 6 + 16), y, tagColor);
          y += 12;

          if (entry.comment) {
            doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5);
            doc.setTextColor(GREY[0], GREY[1], GREY[2]);
            var commentLines = doc.splitTextToSize(entry.comment, maxWidth - 20);
            newPageIfNeeded(commentLines.length * 11);
            doc.text(commentLines, marginLeft + 20, y);
            y += commentLines.length * 11;
          }
          y += 4;
        });
        y += (qi < items.length - 1 ? 6 : 14);
      });
    }
    if (d.sections && d.sections.length) {
      sectionTitle('Section Progress');
      d.sections.forEach(function (sec) {
        bodyLine(sec.label + (sec.repeatable ? ' (repeatable, min ' + sec.minOccurrences + ')' : '') + '   —   ' + sec.cafesStarted + ' café(s) started, ' + sec.totalOccurrenceSubmissions + ' submission(s) total', { size: 9, gap: 6 });
      });
      y += 8;
      d.sections.forEach(function (sec) {
        pdfQuestionSection(sec.label + ' — Breakdown', sec.itemBreakdown || []);
        pdfTextResponseSection(sec.label + ' — Comments', sec.textResponses || []);
      });
    }
    pdfQuestionSection('Checklist Question Breakdown', d.questionBreakdown);
    pdfQuestionSection('Conditional Section Breakdown', d.conditionalBreakdown);

    function pdfTextResponseSection(title, items) {
      if (!items || !items.length) return;
      var withResponses = items.filter(function (q) { return q.responses.length; });
      if (!withResponses.length) return;
      sectionTitle(title);
      withResponses.forEach(function (q, qi) {
        newPageIfNeeded(16);
        bodyLine(q.label, { bold: true, size: 10, gap: 6 });
        q.responses.forEach(function (r) {
          newPageIfNeeded(14);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
          doc.setTextColor(BLACK[0], BLACK[1], BLACK[2]);
          doc.text(r.cafe, marginLeft + 12, y);
          y += 11;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
          doc.setTextColor(GREY[0], GREY[1], GREY[2]);
          var lines = doc.splitTextToSize(r.text, maxWidth - 20);
          newPageIfNeeded(lines.length * 11);
          doc.text(lines, marginLeft + 20, y);
          y += lines.length * 11 + 4;
        });
        y += (qi < withResponses.length - 1 ? 6 : 14);
      });
    }
    pdfTextResponseSection('Checklist Comment Responses', d.textResponses);
    pdfTextResponseSection('Conditional Comment Responses', d.textResponsesConditional);

    if (d.photoSubmissions && d.photoSubmissions.length) {
      sectionTitle('Submitted Photos (' + d.photoSubmissions.length + ')');
      var photoW = 110, photoH = 82, gap = 12, perRow = Math.max(1, Math.floor((maxWidth + gap) / (photoW + gap)));
      var col = 0;
      d.photoSubmissions.forEach(function (p) {
        if (col === 0) newPageIfNeeded(photoH + 34);
        var x = marginLeft + col * (photoW + gap);
        try {
          doc.addImage(p.photo, 'JPEG', x, y, photoW, photoH);
        } catch (e) {
          doc.setDrawColor(GREY_LIGHT[0], GREY_LIGHT[1], GREY_LIGHT[2]);
          doc.rect(x, y, photoW, photoH, 'S');
        }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
        doc.setTextColor(BLACK[0], BLACK[1], BLACK[2]);
        doc.text(p.cafe, x, y + photoH + 11, { maxWidth: photoW });
        doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5);
        doc.setTextColor(GREY[0], GREY[1], GREY[2]);
        var qLines = doc.splitTextToSize(p.questionLabel, photoW);
        doc.text(qLines[0] || '', x, y + photoH + 20);
        col += 1;
        if (col >= perRow) { col = 0; y += photoH + 34; }
      });
      if (col !== 0) y += photoH + 34;
      y += 6;
    }

    // Stamp the footer on every page in one final pass — avoids any risk of footer text
    // overlapping content that was still being written near the bottom of a page.
    var totalPages = doc.internal.getNumberOfPages();
    for (var p = 1; p <= totalPages; p++) {
      doc.setPage(p);
      doc.setDrawColor(GREY_LIGHT[0], GREY_LIGHT[1], GREY_LIGHT[2]);
      doc.setLineWidth(0.5);
      doc.line(marginLeft, pageHeight - 38, pageWidth - marginRight, pageHeight - 38);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
      doc.setTextColor(GREY[0], GREY[1], GREY[2]);
      doc.text('Internal Use Only', marginLeft, pageHeight - 25);
      doc.text('Page ' + p + ' of ' + totalPages, pageWidth - marginRight, pageHeight - 25, { align: 'right' });
    }

    var safeName = (d.tracker.name || 'Launch').replace(/[\\/:*?"<>|]/g, '-').trim();
    doc.save('Launch Tracker - ' + safeName + '.pdf');
  }

  // ---------------------- TRACKER DETAIL ----------------------
  function renderTrackerDetail(id) {
    app.innerHTML =
      '<div class="nav"><div class="logo">Bootlegger</div><div class="meta"><span class="link" id="logoutLink2">Log Out</span></div></div>' +
      '<div class="page">' +
        '<a class="back-link" id="backBtn">&larr; All Launch Trackers</a>' +
        '<div id="trackerDetail" style="margin-top:16px;"><div class="empty-state">Loading…</div></div>' +
      '</div>' +
      '<div class="footer"><div>Internal Use Only</div></div>';
    document.getElementById('backBtn').onclick = function () { navigate('/'); };
    document.getElementById('logoutLink2').onclick = function () { api('/auth/logout', { method: 'POST' }).then(function () { navigate('/'); }); };

    Promise.all([api('/trackers/' + id), api('/trackers/' + id + '/submissions')])
      .then(function (results) { renderTrackerDetailContent(results[0], results[1]); })
      .catch(function (e) { if (e.status === 401) renderLogin(false); });
  }

  function renderTrackerDetailContent(tracker, submissions) {
    var link = window.location.origin + '/launch/' + tracker.id;
    var flagged = submissions.filter(isFlagged).length;

    var html =
      '<div class="page-header">' +
        '<div><h1>' + esc(tracker.name) + '</h1><div class="sub">' + esc(tracker.description || 'Menu / product launch') + '</div></div>' +
        '<span class="badge">' + submissions.length + ' Submitted' + (flagged ? ' · ' + flagged + ' Flagged' : '') + '</span>' +
      '</div>' +
      '<div class="card" style="margin-bottom:20px;">' +
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px;">Submission Link — share with branches, no login required</div>' +
        '<div class="link-row"><input type="text" readonly id="shareLink" value="' + esc(link) + '"><button class="btn outline" id="copyLinkBtn">Copy</button>' +
        '<button class="btn outline" id="editTemplateBtn">Edit Template</button>' +
        '<button class="btn ' + (tracker.active ? 'outline' : 'gold') + '" id="toggleActiveBtn">' + (tracker.active ? 'Archive' : 'Reactivate') + '</button></div>' +
        '<div style="font-size:10px;color:var(--grey-500);margin-top:8px;">Public form title shown to branches: <strong>' + esc(tracker.form_title) + '</strong></div>' +
      '</div>';

    if (!submissions.length) {
      html += '<div class="card empty-state">No submissions yet. Share the link above with each branch.</div>';
    } else {
      html += submissions.map(submissionCardHtml).join('');
    }

    document.getElementById('trackerDetail').innerHTML = html;
    document.getElementById('copyLinkBtn').onclick = function () {
      navigator.clipboard.writeText(link).then(function () {
        var b = document.getElementById('copyLinkBtn');
        b.textContent = 'Copied!';
        setTimeout(function () { b.textContent = 'Copy'; }, 1500);
      });
    };
    document.getElementById('editTemplateBtn').onclick = function () { openTemplateEditor(tracker); };
    document.getElementById('toggleActiveBtn').onclick = function () {
      api('/trackers/' + tracker.id, { method: 'PATCH', body: { active: !tracker.active } })
        .then(function () { renderTrackerDetail(tracker.id); });
    };

    submissions.forEach(function (s) {
      (s.answers || []).concat(s.conditional_answers || []).forEach(function (a) {
        if (a.photo) {
          var elImg = document.getElementById('thumb-' + s.id + '-' + a.id);
          if (elImg) elImg.onclick = function () { openLightbox(a.photo); };
        }
      });
    });
  }

  function checkIcon(v) { return v ? '<span class="check-ok">✓ Yes</span>' : '<span class="check-bad">✕ No</span>'; }

  function submissionCardHtml(s) {
    var flaggedBadge = isFlagged(s) ? '<span class="pill flag">Flagged</span>' : '<span class="pill up">All Clear</span>';
    var answerRows = (s.answers || []).map(function (a) { return answerRowHtml(s.id, a); }).join('');
    var condBlock = '';
    if (s.conditional_triggered) {
      condBlock = '<div style="margin-top:10px;"><span class="conditional-tag">Conditional Section Triggered</span><div class="sub-answers">' +
        (s.conditional_answers || []).map(function (a) { return answerRowHtml(s.id, a); }).join('') + '</div></div>';
    }
    return '<div class="sub-card">' +
      '<div class="sub-top">' +
        '<div><div class="sub-cafe">' + esc(s.cafe) + '</div><div class="sub-meta">' + esc(s.submitted_by) + ' · ' + fmtDate(s.submitted_at) + '</div></div>' +
        flaggedBadge +
      '</div>' +
      '<div class="sub-answers">' + answerRows + '</div>' +
      condBlock +
    '</div>';
  }

  function answerRowHtml(subId, a) {
    var photo = a.photo ? '<img class="thumb" id="thumb-' + subId + '-' + a.id + '" src="' + a.photo + '" title="' + esc(a.label) + '">' : '';
    return '<div class="answer-row"><span class="a-label">' + esc(a.label) + '</span>' + checkIcon(a.value) + '</div>' + (photo ? '<div>' + photo + '</div>' : '');
  }

  function openLightbox(src) {
    var backdrop = document.createElement('div');
    backdrop.className = 'lightbox-backdrop';
    backdrop.innerHTML = '<img src="' + src + '">';
    backdrop.onclick = function () { backdrop.remove(); };
    document.body.appendChild(backdrop);
  }

  // ---------------------- TEMPLATE EDITOR (create + edit) ----------------------
  function openTemplateEditor(existingTracker) {
    var isEdit = !!existingTracker;
    var data = isEdit
      ? JSON.parse(JSON.stringify({
          name: existingTracker.name, form_title: existingTracker.form_title, description: existingTracker.description,
          checklist_items: existingTracker.checklist_items, conditional: existingTracker.conditional,
          assigned_cafes: existingTracker.assigned_cafes || [], exemptions: existingTracker.exemptions || [],
          scenario: existingTracker.scenario || 'standard', sections: existingTracker.sections || [],
        }))
      : Object.assign({ name: '', form_title: '', description: '', assigned_cafes: [], exemptions: [], scenario: 'standard', sections: [] }, defaultTemplate());

    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = '<div class="modal wide">' +
      '<h3>' + (isEdit ? 'Edit Launch Template' : 'New Launch Tracker') + '</h3>' +
      '<div class="field"><label>Launch Name (internal, shown on dashboard)</label><input type="text" id="teName" value="' + esc(data.name) + '" placeholder="e.g. Winter Menu Launch 2026"></div>' +
      '<div class="field"><label>Submission Form Title (what branches see)</label><input type="text" id="teFormTitle" value="' + esc(data.form_title) + '" placeholder="Defaults to the launch name if left blank">' +
        '<div class="hint">This can be different from the internal launch name — e.g. simpler or more branch-friendly wording.</div></div>' +
      '<div class="field"><label>Description (optional)</label><input type="text" id="teDesc" value="' + esc(data.description || '') + '"></div>' +

      '<div class="editor-section-title">Launch Scenario</div>' +
      '<div class="hint" style="margin-bottom:10px;">Pre-Launch and Post-Launch bundle several submission types behind a single link — cafés can come back to the same link to submit each part (and, for repeatable parts like Training Proof, submit it more than once). Standard keeps the classic single-submission checklist.</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;" id="scenarioButtons">' +
        Object.keys(SCENARIO_LABELS).map(function (sc) {
          return '<button type="button" class="btn ' + (data.scenario === sc ? 'gold' : 'outline') + ' small" data-scenario="' + sc + '">' + SCENARIO_LABELS[sc] + '</button>';
        }).join('') +
      '</div>' +
      (isEdit ? '' : '<div class="hint" style="margin-bottom:16px;">Switching scenario here only pre-fills a starting set of sections below — nothing is locked in until you save.</div>') +

      '<div id="unscopedFlagBanner"></div>' +

      '<div class="editor-section-title">Café Selection</div>' +
      '<div class="hint" style="margin-bottom:10px;">Pick a format to load its cafés, then untick any you want to exclude. Leave empty to make this launch open to all cafés.</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;" id="formatButtons">' +
        FORMAT_OPTIONS.map(function (f) { return '<button type="button" class="btn outline small" data-format="' + esc(f.value) + '">' + esc(f.label) + '</button>'; }).join('') +
      '</div>' +
      '<div id="cafeCountLabel" style="font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:8px;"></div>' +
      '<div id="cafeChecklist" style="max-height:260px;overflow-y:auto;border:1px solid var(--grey-200);padding:10px;"></div>' +

      '<div class="editor-section-title">Exemptions</div>' +
      '<div class="hint" style="margin-bottom:10px;">Exempt a café from this launch (e.g. trading hours, format not applicable). Exempted cafés are excluded from "not yet submitted" reporting in Insights.</div>' +
      '<div id="exemptionForm" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;"></div>' +
      '<div id="exemptionsList"></div>' +

      '<div id="flatChecklistBlock" style="display:' + (data.sections.length ? 'none' : 'block') + ';">' +
        '<div class="editor-section-title">Checklist Items</div>' +
        '<div id="itemsList"></div>' +
        '<div class="add-item-btn" id="addItemBtn">+ Add Check Item</div>' +

        '<div class="editor-section-title">Conditional Section (e.g. store-type specific checks)</div>' +
        '<div class="conditional-toggle-row"><span class="label" style="font-size:12px;font-weight:600;">Enable a conditional section</span>' +
          '<div class="toggle-group" id="condToggle">' +
            '<button type="button" class="toggle-btn yes' + (data.conditional.enabled ? ' active' : '') + '" data-val="true">Yes</button>' +
            '<button type="button" class="toggle-btn no' + (!data.conditional.enabled ? ' active' : '') + '" data-val="false">No</button>' +
          '</div></div>' +
        '<div id="condBody" style="display:' + (data.conditional.enabled ? 'block' : 'none') + ';">' +
          '<div class="field"><label>Trigger Question (shown as a Yes/No toggle on the form)</label><input type="text" id="teCondLabel" value="' + esc(data.conditional.trigger_label) + '" placeholder="e.g. Is this a CPT Non-Halal Hybrid store?"></div>' +
          '<div id="condItemsList"></div>' +
          '<div class="add-item-btn" id="addCondItemBtn">+ Add Conditional Check Item</div>' +
        '</div>' +
      '</div>' +

      '<div id="sectionsBlock" style="display:' + (data.sections.length ? 'block' : 'none') + ';">' +
        '<div class="editor-section-title">Submission Sections</div>' +
        '<div class="hint" style="margin-bottom:10px;">Each section is submitted separately through the same link. Mark a section "repeatable" to let a café submit it more than once (e.g. 3-4 training evidence entries) — Insights and the PDF report roll every occurrence up together.</div>' +
        '<div id="sectionsList"></div>' +
        '<div class="add-item-btn" id="addSectionBtn">+ Add Section</div>' +
      '</div>' +

      '<div id="teError"></div>' +
      '<div class="modal-actions"><button class="btn outline" id="teCancel">Cancel</button><button class="btn gold" id="teSave">' + (isEdit ? 'Save Changes' : 'Create Launch Tracker') + '</button></div>' +
    '</div>';
    document.body.appendChild(backdrop);
    backdrop.onclick = function (e) { if (e.target === backdrop) backdrop.remove(); };
    document.getElementById('teCancel').onclick = function () { backdrop.remove(); };

    // Flag submissions received under a café name that doesn't match anything in the current
    // assigned list — surfaced right here in the editor (where the café list is managed)
    // instead of as its own report section.
    if (isEdit) {
      api('/trackers/' + existingTracker.id + '/insights').then(function (insightsData) {
        var unscoped = insightsData.unscopedSubmittedCafes || [];
        if (!unscoped.length) return;
        var banner = document.getElementById('unscopedFlagBanner');
        if (!banner) return;
        banner.innerHTML = '<div class="card" style="border-color:var(--red-flag);margin-bottom:18px;">' +
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--red-flag);margin-bottom:6px;">⚠ ' + unscoped.length + ' Submission' + (unscoped.length === 1 ? '' : 's') + ' Outside Current Café List</div>' +
          '<div class="hint" style="margin-bottom:8px;">These cafés submitted for this launch but don\'t match anything in the café list below — likely a naming mismatch or the list was edited after they submitted: <strong>' + unscoped.map(esc).join(', ') + '</strong>. They still count in question breakdowns, just not in "Launch Success Rate".</div>' +
        '</div>';
      }).catch(function () { /* non-critical — silently skip if insights can't be loaded */ });
    }

    // ---- Café checklist ----
    function renderCafeChecklist() {
      var byRegion = {};
      data.assigned_cafes.forEach(function (s) {
        var region = s.region || 'OTHER';
        if (!byRegion[region]) byRegion[region] = [];
        byRegion[region].push(s);
      });
      var countLabel = document.getElementById('cafeCountLabel');
      countLabel.textContent = data.assigned_cafes.length
        ? data.assigned_cafes.length + ' café' + (data.assigned_cafes.length === 1 ? '' : 's') + ' assigned'
        : 'No cafés selected — open to all cafés';

      var el = document.getElementById('cafeChecklist');
      if (!data.assigned_cafes.length) {
        el.innerHTML = '<div class="empty-state" style="padding:16px;">Pick a format above to load cafés.</div>';
        return;
      }
      el.innerHTML = Object.keys(byRegion).sort().map(function (region) {
        return '<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--grey-500);margin:10px 0 4px;">' + esc(region) + '</div>' +
          byRegion[region].map(function (s) {
            return '<label style="display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;">' +
              '<input type="checkbox" checked data-cafe="' + esc(s.name) + '"> ' + esc(s.name) + '</label>';
          }).join('');
      }).join('');
      el.querySelectorAll('input[data-cafe]').forEach(function (cb) {
        cb.addEventListener('change', function () {
          if (!cb.checked) {
            var cafeName = cb.getAttribute('data-cafe');
            data.assigned_cafes = data.assigned_cafes.filter(function (s) { return s.name !== cafeName; });
            renderCafeChecklist();
            renderExemptionForm();
          }
        });
      });
    }

    document.getElementById('formatButtons').querySelectorAll('button[data-format]').forEach(function (btn) {
      btn.onclick = function () {
        data.assigned_cafes = storesByFormat(btn.getAttribute('data-format'));
        renderCafeChecklist();
        renderExemptionForm();
      };
    });

    // ---- Exemptions ----
    function renderExemptionForm() {
      var formEl = document.getElementById('exemptionForm');
      if (!data.assigned_cafes.length) {
        formEl.innerHTML = '<div class="hint">Select a format above first to add café exemptions.</div>';
        return;
      }
      formEl.innerHTML =
        '<select id="exCafe" style="flex:1;min-width:160px;padding:9px;border:1px solid var(--grey-300);font-family:var(--font);font-size:12px;">' +
          data.assigned_cafes.map(function (s) { return '<option value="' + esc(s.name) + '">' + esc(s.name) + '</option>'; }).join('') +
        '</select>' +
        '<select id="exReason" style="flex:1;min-width:160px;padding:9px;border:1px solid var(--grey-300);font-family:var(--font);font-size:12px;">' +
          EXEMPTION_REASONS.map(function (r) { return '<option value="' + esc(r) + '">' + esc(r) + '</option>'; }).join('') +
        '</select>' +
        '<button type="button" class="btn outline small" id="addExemptionBtn">+ Add Exemption</button>';
      document.getElementById('addExemptionBtn').onclick = function () {
        var cafe = document.getElementById('exCafe').value;
        var reason = document.getElementById('exReason').value;
        data.exemptions = data.exemptions.filter(function (e) { return e.cafe !== cafe; });
        data.exemptions.push({ cafe: cafe, reason: reason });
        renderExemptionsList();
      };
    }

    function renderExemptionsList() {
      var el = document.getElementById('exemptionsList');
      if (!data.exemptions.length) {
        el.innerHTML = '<div class="empty-state" style="padding:10px 0;">No exemptions added.</div>';
        return;
      }
      el.innerHTML = data.exemptions.map(function (e, idx) {
        return '<div class="item-row"><span style="flex:1;font-size:12px;">' + esc(e.cafe) + ' — <span style="color:var(--grey-500);">' + esc(e.reason) + '</span></span>' +
          '<span class="remove-item" data-ex-idx="' + idx + '">✕</span></div>';
      }).join('');
      el.querySelectorAll('[data-ex-idx]').forEach(function (span) {
        span.addEventListener('click', function () {
          data.exemptions.splice(parseInt(span.getAttribute('data-ex-idx'), 10), 1);
          renderExemptionsList();
        });
      });
    }

    renderCafeChecklist();
    renderExemptionForm();
    renderExemptionsList();

    // ---- Checklist items (unchanged behaviour) ----
    function renderItemRows(containerId, items) {
      var c = document.getElementById(containerId);
      c.innerHTML = items.map(function (it, idx) {
        if (!it.input_type) it.input_type = 'yesno';
        return '<div class="item-row" data-idx="' + idx + '">' +
          '<input type="text" value="' + esc(it.label) + '" data-field="label">' +
          '<select data-field="input-type" style="font-size:10px;text-transform:uppercase;border:1px solid var(--grey-300);padding:5px 6px;font-family:var(--font);">' +
            '<option value="yesno"' + (it.input_type === 'yesno' ? ' selected' : '') + '>Yes / No</option>' +
            '<option value="checkbox"' + (it.input_type === 'checkbox' ? ' selected' : '') + '>Tick-box only</option>' +
            '<option value="text"' + (it.input_type === 'text' ? ' selected' : '') + '>Comment Box</option>' +
          '</select>' +
          '<label class="photo-toggle"><input type="checkbox" data-field="photo"' + (it.requires_photo ? ' checked' : '') + '> Add Picture</label>' +
          '<span class="remove-item" data-remove="1">✕</span>' +
        '</div>';
      }).join('');
      c.querySelectorAll('.item-row').forEach(function (row) {
        var idx = parseInt(row.getAttribute('data-idx'), 10);
        row.querySelector('input[data-field=label]').addEventListener('input', function (e) { items[idx].label = e.target.value; });
        row.querySelector('input[data-field=photo]').addEventListener('change', function (e) { items[idx].requires_photo = e.target.checked; });
        row.querySelector('select[data-field="input-type"]').addEventListener('change', function (e) { items[idx].input_type = e.target.value; });
        row.querySelector('.remove-item').addEventListener('click', function () { items.splice(idx, 1); renderItemRows(containerId, items); });
      });
    }

    renderItemRows('itemsList', data.checklist_items);
    renderItemRows('condItemsList', data.conditional.items);

    document.getElementById('addItemBtn').onclick = function () {
      data.checklist_items.push({ id: genId('it'), label: '', requires_photo: false, input_type: 'yesno' });
      renderItemRows('itemsList', data.checklist_items);
    };
    document.getElementById('addCondItemBtn').onclick = function () {
      data.conditional.items.push({ id: genId('ct'), label: '', requires_photo: false, input_type: 'yesno' });
      renderItemRows('condItemsList', data.conditional.items);
    };
    document.getElementById('condToggle').querySelectorAll('.toggle-btn').forEach(function (btn) {
      btn.onclick = function () {
        document.getElementById('condToggle').querySelectorAll('.toggle-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        data.conditional.enabled = btn.getAttribute('data-val') === 'true';
        document.getElementById('condBody').style.display = data.conditional.enabled ? 'block' : 'none';
      };
    });

    // ---- Scenario picker: swaps the flat checklist for the sections builder ----
    document.getElementById('scenarioButtons').querySelectorAll('button[data-scenario]').forEach(function (btn) {
      btn.onclick = function () {
        var sc = btn.getAttribute('data-scenario');
        data.scenario = sc;
        document.getElementById('scenarioButtons').querySelectorAll('button[data-scenario]').forEach(function (b) {
          b.className = 'btn ' + (b === btn ? 'gold' : 'outline') + ' small';
        });
        if (sc === 'standard') {
          document.getElementById('flatChecklistBlock').style.display = 'block';
          document.getElementById('sectionsBlock').style.display = 'none';
        } else {
          // Only auto-load the preset the very first time a scenario is picked with no sections yet —
          // never overwrite sections the admin has already started customising.
          if (!data.sections.length && SECTION_PRESETS[sc]) data.sections = SECTION_PRESETS[sc]();
          document.getElementById('flatChecklistBlock').style.display = 'none';
          document.getElementById('sectionsBlock').style.display = 'block';
          renderSections();
        }
      };
    });

    // ---- Sections builder ----
    function renderSections() {
      var el = document.getElementById('sectionsList');
      if (!data.sections.length) {
        el.innerHTML = '<div class="empty-state" style="padding:16px;">No sections yet — add one below.</div>';
        return;
      }
      el.innerHTML = data.sections.map(function (sec, sIdx) {
        return '<div class="card" style="margin-bottom:14px;" data-sec-idx="' + sIdx + '">' +
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">' +
            '<input type="text" data-sec-field="label" value="' + esc(sec.label) + '" placeholder="Section name" style="flex:1;min-width:160px;padding:9px;border:1px solid var(--grey-300);font-family:var(--font);font-size:13px;font-weight:700;">' +
            '<label style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;">' +
              '<input type="checkbox" data-sec-field="repeatable"' + (sec.repeatable ? ' checked' : '') + '> Repeatable</label>' +
            (sec.repeatable
              ? '<label style="display:flex;align-items:center;gap:6px;font-size:11px;">Min <input type="number" min="1" max="20" data-sec-field="minOccurrences" value="' + sec.minOccurrences + '" style="width:50px;padding:5px;border:1px solid var(--grey-300);"></label>' +
                '<label style="display:flex;align-items:center;gap:6px;font-size:11px;">Max <input type="number" min="1" max="20" data-sec-field="maxOccurrences" value="' + sec.maxOccurrences + '" style="width:50px;padding:5px;border:1px solid var(--grey-300);"></label>'
              : '') +
            '<span class="remove-item" data-remove-sec="1">✕ Remove Section</span>' +
          '</div>' +
          '<div id="secItems-' + sIdx + '"></div>' +
          '<div class="add-item-btn" data-add-sec-item="' + sIdx + '" style="margin-top:6px;">+ Add Item to This Section</div>' +
        '</div>';
      }).join('');

      data.sections.forEach(function (sec, sIdx) { renderSectionItemRows(sIdx); });

      el.querySelectorAll('[data-sec-idx]').forEach(function (card) {
        var sIdx = parseInt(card.getAttribute('data-sec-idx'), 10);
        var sec = data.sections[sIdx];
        card.querySelector('input[data-sec-field=label]').addEventListener('input', function (e) { sec.label = e.target.value; });
        card.querySelector('input[data-sec-field=repeatable]').addEventListener('change', function (e) {
          sec.repeatable = e.target.checked;
          if (sec.repeatable) { sec.maxOccurrences = sec.maxOccurrences && sec.maxOccurrences > 1 ? sec.maxOccurrences : 4; sec.minOccurrences = sec.minOccurrences || 1; }
          else { sec.maxOccurrences = 1; sec.minOccurrences = 1; }
          renderSections();
        });
        var minInput = card.querySelector('input[data-sec-field=minOccurrences]');
        if (minInput) minInput.addEventListener('input', function (e) { sec.minOccurrences = Math.max(1, parseInt(e.target.value, 10) || 1); });
        var maxInput = card.querySelector('input[data-sec-field=maxOccurrences]');
        if (maxInput) maxInput.addEventListener('input', function (e) { sec.maxOccurrences = Math.max(1, parseInt(e.target.value, 10) || 1); });
        card.querySelector('[data-remove-sec]').addEventListener('click', function () { data.sections.splice(sIdx, 1); renderSections(); });
      });
      el.querySelectorAll('[data-add-sec-item]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var sIdx = parseInt(btn.getAttribute('data-add-sec-item'), 10);
          data.sections[sIdx].items.push(newItem('', 'yesno'));
          renderSectionItemRows(sIdx);
        });
      });
    }

    function renderSectionItemRows(sIdx) {
      var items = data.sections[sIdx].items;
      var c = document.getElementById('secItems-' + sIdx);
      if (!c) return;
      c.innerHTML = items.map(function (it, idx) {
        if (!it.input_type) it.input_type = 'yesno';
        return '<div class="item-row" data-idx="' + idx + '">' +
          '<input type="text" value="' + esc(it.label) + '" data-field="label">' +
          '<select data-field="input-type" style="font-size:10px;text-transform:uppercase;border:1px solid var(--grey-300);padding:5px 6px;font-family:var(--font);">' +
            '<option value="yesno"' + (it.input_type === 'yesno' ? ' selected' : '') + '>Yes / No</option>' +
            '<option value="checkbox"' + (it.input_type === 'checkbox' ? ' selected' : '') + '>Tick-box only</option>' +
            '<option value="text"' + (it.input_type === 'text' ? ' selected' : '') + '>Comment Box</option>' +
          '</select>' +
          '<label class="photo-toggle"><input type="checkbox" data-field="photo"' + (it.requires_photo ? ' checked' : '') + '> Add Picture</label>' +
          '<label class="photo-toggle"><input type="checkbox" data-field="date"' + (it.requires_date ? ' checked' : '') + '> Add Date</label>' +
          '<span class="remove-item" data-remove="1">✕</span>' +
        '</div>';
      }).join('');
      c.querySelectorAll('.item-row').forEach(function (row) {
        var idx = parseInt(row.getAttribute('data-idx'), 10);
        row.querySelector('input[data-field=label]').addEventListener('input', function (e) { items[idx].label = e.target.value; });
        row.querySelector('input[data-field=photo]').addEventListener('change', function (e) { items[idx].requires_photo = e.target.checked; });
        row.querySelector('input[data-field=date]').addEventListener('change', function (e) { items[idx].requires_date = e.target.checked; });
        row.querySelector('select[data-field="input-type"]').addEventListener('change', function (e) { items[idx].input_type = e.target.value; });
        row.querySelector('.remove-item').addEventListener('click', function () { items.splice(idx, 1); renderSectionItemRows(sIdx); });
      });
    }

    if (data.sections.length) renderSections();
    document.getElementById('addSectionBtn').onclick = function () {
      data.sections.push(newSection('', 'custom', false, []));
      renderSections();
    };

    document.getElementById('teSave').onclick = function () {
      var errEl = document.getElementById('teError'); errEl.innerHTML = '';
      var name = document.getElementById('teName').value.trim();
      var formTitle = document.getElementById('teFormTitle').value.trim() || name;
      var desc = document.getElementById('teDesc').value.trim();
      data.conditional.trigger_label = document.getElementById('teCondLabel') ? document.getElementById('teCondLabel').value.trim() : data.conditional.trigger_label;

      if (!name) { errEl.innerHTML = '<div class="error-msg">Launch name is required</div>'; return; }

      var usingSections = data.sections.length > 0;
      if (usingSections) {
        var emptySecLabel = data.sections.some(function (s) { return !s.label.trim(); });
        if (emptySecLabel) { errEl.innerHTML = '<div class="error-msg">Every section needs a name</div>'; return; }
        var emptySecItem = data.sections.some(function (s) { return !s.items.length || s.items.some(function (it) { return !it.label.trim(); }); });
        if (emptySecItem) { errEl.innerHTML = '<div class="error-msg">Every section needs at least one item, and every item needs a label</div>'; return; }
        var badRange = data.sections.some(function (s) { return s.repeatable && s.minOccurrences > s.maxOccurrences; });
        if (badRange) { errEl.innerHTML = '<div class="error-msg">A section\'s minimum submissions can\'t be greater than its maximum</div>'; return; }
      } else {
        var emptyItem = data.checklist_items.some(function (it) { return !it.label.trim(); });
        if (emptyItem) { errEl.innerHTML = '<div class="error-msg">Every checklist item needs a label (or remove the blank one)</div>'; return; }
        if (data.conditional.enabled) {
          if (!data.conditional.trigger_label) { errEl.innerHTML = '<div class="error-msg">Conditional section needs a trigger question</div>'; return; }
          var emptyCond = data.conditional.items.some(function (it) { return !it.label.trim(); });
          if (emptyCond) { errEl.innerHTML = '<div class="error-msg">Every conditional item needs a label</div>'; return; }
        }
      }

      var payload = {
        name: name, formTitle: formTitle, description: desc, checklistItems: data.checklist_items, conditional: data.conditional,
        assignedCafes: data.assigned_cafes, exemptions: data.exemptions,
        scenario: data.scenario, sections: usingSections ? data.sections : [],
      };
      var req = isEdit
        ? api('/trackers/' + existingTracker.id, { method: 'PATCH', body: payload })
        : api('/trackers', { method: 'POST', body: payload });

      req.then(function (t) {
        backdrop.remove();
        navigate('/tracker/' + t.id);
      }).catch(function (e) { errEl.innerHTML = '<div class="error-msg">' + esc(e.message) + '</div>'; });
    };
  }

  // ---------------------- PUBLIC SUBMISSION FORM (no login) ----------------------
  function renderSubmissionForm(trackerId) {
    app.innerHTML =
      '<div class="nav"><div class="logo">Bootlegger</div><div class="meta">Launch Checklist</div></div>' +
      '<div class="form-wrap" id="formWrap"><div class="empty-state">Loading…</div></div>';

    api('/trackers/' + trackerId).then(function (tracker) {
      if (!tracker.active) {
        document.getElementById('formWrap').innerHTML = '<div class="form-card empty-state">This launch tracker has been archived and is no longer accepting submissions.</div>';
        return;
      }
      if (tracker.sections && tracker.sections.length) buildSectionedSubmissionFlow(tracker);
      else buildSubmissionForm(tracker);
    }).catch(function () {
      document.getElementById('formWrap').innerHTML = '<div class="form-card empty-state">Launch link not found. Please check the URL with your regional manager.</div>';
    });
  }

  var DECLARATION_TEXT = 'I hereby declare that this task/launch/confirmation is 100% accurate and as per the requirements set out.';

  // Shared item-block renderer used by both the legacy flat form and the sectioned flow —
  // adds an optional date field alongside the existing optional photo field.
  function sharedItemBlockHtml(it) {
    var photoBlock = it.requires_photo
      ? '<div class="photo-block" id="photoBlock-' + it.id + '">' +
          '<div class="ph-label">Photo (optional)</div>' +
          '<label class="file-btn-label">Choose / Take Photo<input type="file" accept="image/*" capture="environment" id="photoInput-' + it.id + '"></label>' +
          '<img class="photo-preview" id="preview-' + it.id + '" style="display:none;">' +
        '</div>'
      : '';
    var dateBlock = it.requires_date
      ? '<div class="field" style="margin:8px 0 10px;"><label>Date</label><input type="date" id="dateInput-' + it.id + '" style="width:100%;padding:9px 12px;border:1px solid var(--grey-300);font-family:var(--font);font-size:13px;"></div>'
      : '';
    var questionBlock;
    if (it.input_type === 'checkbox') {
      questionBlock = '<div class="check-row"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;"><input type="checkbox" data-checkbox-field="' + it.id + '" style="width:18px;height:18px;"><span class="label">' + esc(it.label) + '</span></label></div>';
    } else if (it.input_type === 'text') {
      questionBlock = '<div class="field" style="margin-bottom:10px;"><label>' + esc(it.label) + '</label>' +
        '<textarea data-text-field="' + it.id + '" placeholder="Type your response…" style="width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--grey-300);font-family:var(--font);font-size:13px;"></textarea></div>';
    } else {
      questionBlock = checkRow(it.id, esc(it.label));
    }
    return questionBlock + dateBlock + photoBlock;
  }

  // ---------------------- SECTIONED PUBLIC SUBMISSION FLOW (Pre-/Post-Launch scenarios) ----------------------
  // One link, several independently-submitted sections. A café picks itself once, then works
  // through a hub of sections — repeatable ones (e.g. Training Proof) can be submitted several
  // times, tracked as separate "occurrences" that all roll up together in Insights/PDF.
  function buildSectionedSubmissionFlow(tracker) {
    var sf = { cafe: '', submittedBy: '', region: null };
    var scoped = (tracker.assigned_cafes && tracker.assigned_cafes.length) ? tracker.assigned_cafes : FLAT_STORES;
    var wrap = document.getElementById('formWrap');

    function renderCafePicker() {
      var byRegion = {};
      scoped.forEach(function (s) {
        var region = s.region || 'OTHER';
        if (!byRegion[region]) byRegion[region] = [];
        byRegion[region].push(s.name);
      });
      var storeOptions = '<option value="">Select your café…</option>' +
        Object.keys(byRegion).map(function (region) {
          return '<optgroup label="' + esc(region) + '">' + byRegion[region].map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('') + '</optgroup>';
        }).join('');

      wrap.innerHTML =
        '<div class="form-card">' +
          '<div class="form-title">' + esc(tracker.form_title) + '</div>' +
          '<div class="form-sub">' + esc(tracker.description || 'This launch has several parts — pick your café to see what\'s outstanding.') + '</div>' +
          '<div class="field"><label>Café Name</label><select id="fCafe">' + storeOptions + '</select></div>' +
          '<div class="field"><label>Submitted By</label><input type="text" id="fBy" placeholder="Your full name"></div>' +
          '<div id="formError"></div>' +
          '<button class="btn gold submit-btn" id="continueBtn">Continue</button>' +
        '</div>';

      document.getElementById('continueBtn').onclick = function () {
        var cafe = document.getElementById('fCafe').value;
        var by = document.getElementById('fBy').value.trim();
        var errEl = document.getElementById('formError');
        var missing = [];
        if (!cafe) missing.push('Café name');
        if (!by) missing.push('Submitted by');
        if (missing.length) { errEl.innerHTML = '<div class="error-msg">Please complete: ' + missing.join(', ') + '</div>'; return; }
        sf.cafe = cafe; sf.submittedBy = by;
        var match = FLAT_STORES.find(function (s) { return s.name === cafe; });
        sf.region = match ? match.region : null;
        renderHub();
      };
    }

    function statusLabel(sec) {
      if (sec.status === 'complete') return sec.repeatable ? ('Complete (' + sec.submittedCount + '/' + sec.maxOccurrences + ')') : 'Complete';
      if (sec.status === 'in_progress') return 'In Progress (' + sec.submittedCount + '/' + sec.minOccurrences + ' min)';
      return 'Not Started';
    }
    function statusColor(sec) {
      if (sec.status === 'complete') return 'var(--gold)';
      if (sec.status === 'in_progress') return 'var(--red-flag, #a94442)';
      return 'var(--grey-500)';
    }

    function renderHub(bannerHtml) {
      wrap.innerHTML = '<div class="form-card"><div class="empty-state">Loading…</div></div>';
      api('/trackers/' + tracker.id + '/cafe-progress?cafe=' + encodeURIComponent(sf.cafe)).then(function (data) {
        var sections = data.sections;
        var allDone = sections.every(function (s) { return s.status === 'complete'; });
        wrap.innerHTML =
          '<div class="form-card">' +
            (bannerHtml || '') +
            '<div class="form-title">' + esc(tracker.form_title) + '</div>' +
            '<div class="form-sub">' + esc(sf.cafe) + ' · ' + esc(sf.submittedBy) + '</div>' +
            (allDone
              ? '<div class="success-screen" style="padding:24px 0;"><div class="tick">✓</div><h2>All Sections Complete</h2><p>' + esc(sf.cafe) + ' has submitted everything required for this launch.</p></div>'
              : '') +
            sections.map(function (sec) {
              return '<div class="check-row" style="align-items:center;">' +
                '<span class="label" style="flex:1;">' + esc(sec.label) + (sec.repeatable ? ' <span class="hint" style="display:inline;">(repeatable)</span>' : '') + '</span>' +
                '<span style="font-size:10px;font-weight:700;text-transform:uppercase;color:' + statusColor(sec) + ';margin-right:10px;">' + statusLabel(sec) + '</span>' +
                (sec.canSubmitMore
                  ? '<button type="button" class="btn outline small" data-section-id="' + sec.id + '">' + (sec.submittedCount > 0 ? 'Add Another' : 'Submit') + '</button>'
                  : '<button type="button" class="btn outline small" disabled>Done</button>') +
              '</div>';
            }).join('') +
            '<button class="btn outline" id="switchCafeBtn" style="margin-top:16px;">Switch Café</button>' +
          '</div>';

        wrap.querySelectorAll('[data-section-id]').forEach(function (btn) {
          btn.onclick = function () {
            var sec = tracker.sections.find(function (s) { return s.id === btn.getAttribute('data-section-id'); });
            renderSectionForm(sec);
          };
        });
        document.getElementById('switchCafeBtn').onclick = renderCafePicker;
      }).catch(function () {
        wrap.innerHTML = '<div class="form-card empty-state">Could not load progress for this café. Please try again.</div>';
      });
    }

    function renderSectionForm(sec) {
      var answers = {};
      sec.items.forEach(function (it) { answers[it.id] = { value: null, photo: null, text: '', date: null }; });

      wrap.innerHTML =
        '<div class="form-card">' +
          '<div class="form-title">' + esc(sec.label) + '</div>' +
          '<div class="form-sub">' + esc(sf.cafe) + ' · ' + esc(sf.submittedBy) + '</div>' +
          sec.items.map(sharedItemBlockHtml).join('') +
          '<div class="disclaimer-check"><input type="checkbox" id="fDisclaimer"><span>' + esc(DECLARATION_TEXT) + '</span></div>' +
          '<div id="formError"></div>' +
          '<button class="btn gold submit-btn" id="submitSectionBtn">Submit ' + esc(sec.label) + '</button>' +
          '<button class="btn outline" id="backToHubBtn" style="margin-top:10px;">&larr; Back</button>' +
        '</div>';

      wrap.querySelectorAll('.toggle-group').forEach(function (group) {
        var field = group.getAttribute('data-field');
        group.querySelectorAll('.toggle-btn').forEach(function (btn) {
          btn.onclick = function () {
            group.querySelectorAll('.toggle-btn').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            if (answers[field]) answers[field].value = btn.getAttribute('data-val') === 'true';
          };
        });
      });
      wrap.querySelectorAll('[data-checkbox-field]').forEach(function (cb) {
        var field = cb.getAttribute('data-checkbox-field');
        cb.addEventListener('change', function () { if (answers[field]) answers[field].value = cb.checked ? true : null; });
      });
      wrap.querySelectorAll('[data-text-field]').forEach(function (ta) {
        var field = ta.getAttribute('data-text-field');
        ta.addEventListener('input', function () {
          var text = ta.value.trim();
          if (answers[field]) { answers[field].value = text ? true : null; answers[field].text = text; }
        });
      });
      sec.items.forEach(function (it) {
        if (it.requires_photo) {
          var input = document.getElementById('photoInput-' + it.id);
          if (input) input.addEventListener('change', function (e) {
            var file = e.target.files[0];
            if (!file) return;
            compressImage(file).then(function (dataUrl) {
              answers[it.id].photo = dataUrl;
              var img = document.getElementById('preview-' + it.id);
              img.src = dataUrl; img.style.display = 'block';
            }).catch(function () { alert('Could not process that photo — please try another.'); });
          });
        }
        if (it.requires_date) {
          var dateInput = document.getElementById('dateInput-' + it.id);
          if (dateInput) dateInput.addEventListener('input', function () { answers[it.id].date = dateInput.value || null; });
        }
      });

      document.getElementById('backToHubBtn').onclick = function () { renderHub(); };
      document.getElementById('submitSectionBtn').onclick = function () {
        var errEl = document.getElementById('formError');
        var disclaimerConfirmed = document.getElementById('fDisclaimer').checked;
        var missing = [];
        sec.items.forEach(function (it) {
          if (answers[it.id].value === null) missing.push(it.label);
          if (it.requires_date && !answers[it.id].date) missing.push(it.label + ' (date)');
        });
        if (!disclaimerConfirmed) missing.push('Declaration confirmation');
        if (missing.length) { errEl.innerHTML = '<div class="error-msg">Please complete: ' + missing.join(', ') + '</div>'; return; }

        var btn = document.getElementById('submitSectionBtn');
        btn.disabled = true; btn.textContent = 'Submitting…';
        var answerArr = sec.items.map(function (it) {
          return { id: it.id, label: it.label, value: answers[it.id].value, photo: answers[it.id].photo, text: answers[it.id].text || '', date: answers[it.id].date };
        });

        api('/trackers/' + tracker.id + '/submissions', {
          method: 'POST',
          body: { cafe: sf.cafe, region: sf.region, submittedBy: sf.submittedBy, sectionId: sec.id, answers: answerArr, disclaimerConfirmed: disclaimerConfirmed },
        }).then(function () {
          renderHub('<div class="hint" style="background:var(--gold-light,#faf6ee);padding:10px 12px;margin-bottom:14px;border:1px solid var(--gold);">✓ ' + esc(sec.label) + ' submitted.</div>');
        }).catch(function (e) {
          btn.disabled = false; btn.textContent = 'Submit ' + sec.label;
          errEl.innerHTML = '<div class="error-msg">' + esc(e.message) + '</div>';
        });
      };
    }

    renderCafePicker();
  }

  function buildSubmissionForm(tracker) {
    var state = { cafe: '', submittedBy: '', conditionalTriggered: false, disclaimerConfirmed: false };
    var answers = {};
    var condAnswers = {};

    tracker.checklist_items.forEach(function (it) { answers[it.id] = { value: null, photo: null, text: '' }; });
    (tracker.conditional.items || []).forEach(function (it) { condAnswers[it.id] = { value: null, photo: null, text: '' }; });

    // If this launch was assigned to a specific format/café selection, only show those cafés.
    // Trackers created before this feature (or left as "All Formats") fall back to the full masterfile list.
    var scoped = (tracker.assigned_cafes && tracker.assigned_cafes.length) ? tracker.assigned_cafes : FLAT_STORES;
    var submittedNorm = (tracker.submitted_cafes || []).map(function (c) { return c.trim().toLowerCase(); });
    var byRegion = {};
    scoped.forEach(function (s) {
      var region = s.region || 'OTHER';
      if (!byRegion[region]) byRegion[region] = [];
      byRegion[region].push(s.name);
    });
    var storeOptions = '<option value="">Select your café…</option>' +
      Object.keys(byRegion).map(function (region) {
        return '<optgroup label="' + esc(region) + '">' +
          byRegion[region].map(function (n) {
            var already = submittedNorm.indexOf(n.trim().toLowerCase()) !== -1;
            return '<option value="' + esc(n) + '"' + (already ? ' disabled' : '') + '>' + esc(n) + (already ? ' — Already Submitted' : '') + '</option>';
          }).join('') +
          '</optgroup>';
      }).join('');

    function cafeAlreadySubmitted(name) {
      return submittedNorm.indexOf((name || '').trim().toLowerCase()) !== -1;
    }

    function itemBlockHtml(it) {
      var photoBlock = it.requires_photo
        ? '<div class="photo-block" id="photoBlock-' + it.id + '">' +
            '<div class="ph-label">Photo (optional)</div>' +
            '<label class="file-btn-label">Choose / Take Photo<input type="file" accept="image/*" capture="environment" id="photoInput-' + it.id + '"></label>' +
            '<img class="photo-preview" id="preview-' + it.id + '" style="display:none;">' +
          '</div>'
        : '';
      var questionBlock;
      if (it.input_type === 'checkbox') {
        questionBlock = '<div class="check-row"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;"><input type="checkbox" data-checkbox-field="' + it.id + '" style="width:18px;height:18px;"><span class="label">' + esc(it.label) + '</span></label></div>';
      } else if (it.input_type === 'text') {
        questionBlock = '<div class="field" style="margin-bottom:10px;"><label>' + esc(it.label) + '</label>' +
          '<textarea data-text-field="' + it.id + '" placeholder="Type your response…" style="width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--grey-300);font-family:var(--font);font-size:13px;"></textarea></div>';
      } else {
        questionBlock = checkRow(it.id, esc(it.label));
      }
      return questionBlock + photoBlock;
    }

    var wrap = document.getElementById('formWrap');
    wrap.innerHTML =
      '<div class="form-card">' +
        '<div class="form-title">' + esc(tracker.form_title) + '</div>' +
        '<div class="form-sub">' + esc(tracker.description || 'Launch confirmation checklist') + '</div>' +

        '<div class="field"><label>Café Name</label><select id="fCafe">' + storeOptions + '</select></div>' +
        '<div class="field"><label>Submitted By</label><input type="text" id="fBy" placeholder="Your full name"></div>' +

        (tracker.conditional.enabled ?
          '<div class="field"><div class="check-row"><span class="label">' + esc(tracker.conditional.trigger_label) + '</span>' +
            '<div class="toggle-group" data-field="conditionalTriggered">' +
              '<button type="button" class="toggle-btn yes" data-val="true">Yes</button>' +
              '<button type="button" class="toggle-btn no active" data-val="false">No</button>' +
            '</div></div></div>' : '') +

        tracker.checklist_items.map(itemBlockHtml).join('') +

        (tracker.conditional.enabled ?
          '<div id="hybridSection" style="display:none;"><div class="hybrid-section"><div class="section-tag">Additional Checks</div>' +
            tracker.conditional.items.map(itemBlockHtml).join('') +
          '</div></div>' : '') +

        '<div class="disclaimer-check"><input type="checkbox" id="fDisclaimer"><span>' + esc(DECLARATION_TEXT) + '</span></div>' +

        '<div id="formError"></div>' +
        '<button class="btn gold submit-btn" id="submitBtn">Submit Launch Confirmation</button>' +
      '</div>';

    wrap.querySelectorAll('.toggle-group').forEach(function (group) {
      var field = group.getAttribute('data-field');
      group.querySelectorAll('.toggle-btn').forEach(function (btn) {
        btn.onclick = function () {
          group.querySelectorAll('.toggle-btn').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          var val = btn.getAttribute('data-val') === 'true';
          if (field === 'conditionalTriggered') {
            state.conditionalTriggered = val;
            var hs = document.getElementById('hybridSection');
            if (hs) hs.style.display = val ? 'block' : 'none';
          } else if (answers[field]) {
            answers[field].value = val;
          } else if (condAnswers[field]) {
            condAnswers[field].value = val;
          }
        };
      });
    });

    wrap.querySelectorAll('[data-checkbox-field]').forEach(function (cb) {
      var field = cb.getAttribute('data-checkbox-field');
      cb.addEventListener('change', function () {
        var val = cb.checked ? true : null; // unchecked = not yet confirmed, blocks submission
        if (answers[field]) answers[field].value = val;
        else if (condAnswers[field]) condAnswers[field].value = val;
      });
    });

    wrap.querySelectorAll('[data-text-field]').forEach(function (ta) {
      var field = ta.getAttribute('data-text-field');
      ta.addEventListener('input', function () {
        var text = ta.value.trim();
        var val = text ? true : null; // empty = not yet answered, blocks submission
        if (answers[field]) { answers[field].value = val; answers[field].text = text; }
        else if (condAnswers[field]) { condAnswers[field].value = val; condAnswers[field].text = text; }
      });
    });

    tracker.checklist_items.concat(tracker.conditional.items || []).forEach(function (it) {
      if (!it.requires_photo) return;
      var input = document.getElementById('photoInput-' + it.id);
      if (!input) return;
      input.addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        compressImage(file).then(function (dataUrl) {
          if (answers[it.id]) answers[it.id].photo = dataUrl;
          if (condAnswers[it.id]) condAnswers[it.id].photo = dataUrl;
          var img = document.getElementById('preview-' + it.id);
          img.src = dataUrl; img.style.display = 'block';
        }).catch(function () { alert('Could not process that photo — please try another.'); });
      });
    });

    document.getElementById('submitBtn').onclick = function () {
      state.cafe = document.getElementById('fCafe').value;
      state.submittedBy = document.getElementById('fBy').value.trim();
      state.disclaimerConfirmed = document.getElementById('fDisclaimer').checked;

      var errEl = document.getElementById('formError');
      errEl.innerHTML = '';
      var missing = [];
      if (!state.cafe) missing.push('Café name');
      if (!state.submittedBy) missing.push('Submitted by');
      tracker.checklist_items.forEach(function (it) { if (answers[it.id].value === null) missing.push(it.label); });
      if (state.conditionalTriggered) {
        (tracker.conditional.items || []).forEach(function (it) { if (condAnswers[it.id].value === null) missing.push(it.label); });
      }
      if (!state.disclaimerConfirmed) missing.push('Disclaimer confirmation');

      if (missing.length) { errEl.innerHTML = '<div class="error-msg">Please complete: ' + missing.join(', ') + '</div>'; return; }

      if (cafeAlreadySubmitted(state.cafe)) {
        errEl.innerHTML = '<div class="error-msg">' + esc(state.cafe) + ' has already submitted a confirmation for this launch. Contact your regional manager if this needs to be corrected.</div>';
        return;
      }

      var region = null;
      var match = FLAT_STORES.find(function (s) { return s.name === state.cafe; });
      if (match) region = match.region;

      var btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Submitting…';

      var answerArr = tracker.checklist_items.map(function (it) { return { id: it.id, label: it.label, value: answers[it.id].value, photo: answers[it.id].photo, text: answers[it.id].text || '' }; });
      var condArr = state.conditionalTriggered ? (tracker.conditional.items || []).map(function (it) { return { id: it.id, label: it.label, value: condAnswers[it.id].value, photo: condAnswers[it.id].photo, text: condAnswers[it.id].text || '' }; }) : null;

      api('/trackers/' + tracker.id + '/submissions', {
        method: 'POST',
        body: { cafe: state.cafe, region: region, submittedBy: state.submittedBy, answers: answerArr, conditionalTriggered: state.conditionalTriggered, conditionalAnswers: condArr, disclaimerConfirmed: state.disclaimerConfirmed },
      }).then(function () {
        document.getElementById('formWrap').innerHTML =
          '<div class="form-card success-screen"><div class="tick">✓</div><h2>Launch Confirmed</h2>' +
          '<p>Thank you — ' + esc(state.cafe) + '\'s submission has been recorded.</p></div>';
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = 'Submit Launch Confirmation';
        errEl.innerHTML = '<div class="error-msg">' + esc(e.message) + '</div>';
      });
    };
  }

  function checkRow(field, labelHtml) {
    return '<div class="check-row"><span class="label">' + labelHtml + '</span>' +
      '<div class="toggle-group" data-field="' + field + '">' +
        '<button type="button" class="toggle-btn yes" data-val="true">Yes</button>' +
        '<button type="button" class="toggle-btn no" data-val="false">No</button>' +
      '</div></div>';
  }

  route();
})();
</script>
</body>
</html>
